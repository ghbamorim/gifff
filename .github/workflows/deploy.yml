name: Deploy

on:
  push:
    branches:
      - terraform_setup
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          IMAGE=242627333067.dkr.ecr.us-east-2.amazonaws.com/gifff:${GITHUB_SHA}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
