name: Deploy

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release belongs to main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          git fetch origin main

          TAG_COMMIT=$(git rev-parse "${RELEASE_TAG}^{commit}")

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag does not belong to main."
            exit 1
          fi

          echo "Release validated: $RELEASE_TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/gifff:${RELEASE_TAG}"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to EC2
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import time

          region = os.environ["AWS_REGION"]
          version = os.environ["RELEASE_TAG"]

          def aws(*args):
              return subprocess.check_output(
                  ["aws", *args, "--region", region, "--output", "text"],
                  text=True,
              ).strip()

          account_id = aws(
              "sts", "get-caller-identity",
              "--query", "Account",
          )

          registry = f"{account_id}.dkr.ecr.{region}.amazonaws.com"
          image = f"{registry}/gifff:{version}"

          instance_ids = aws(
              "ec2", "describe-instances",
              "--filters",
              "Name=tag:Name,Values=gifff-app",
              "Name=instance-state-name,Values=running",
              "--query", "Reservations[].Instances[].InstanceId",
          ).split()

          if len(instance_ids) != 1:
              raise SystemExit(
                  f"Expected exactly one running EC2, found: {instance_ids}"
              )

          instance_id = instance_ids[0]

          db = json.loads(subprocess.check_output(
              [
                  "aws", "rds", "describe-db-instances",
                  "--region", region,
                  "--output", "json",
              ],
              text=True,
          ))

          databases = [
              item for item in db["DBInstances"]
              if item["DBInstanceIdentifier"] == "gifff-postgres"
          ]

          if len(databases) != 1:
              raise SystemExit("Expected exactly one gifff-postgres RDS instance")

          database = databases[0]
          secret_arn = database["MasterUserSecret"]["SecretArn"]
          db_host = database["Endpoint"]["Address"]
          db_port = database["Endpoint"]["Port"]
          db_name = database["DBName"]

          compose_content = open(
              "deploy/compose.yaml", encoding="utf-8"
          ).read()

          compose_base64 = base64.b64encode(
              compose_content.encode()
          ).decode()

          script = f"""#!/bin/bash
          set -euo pipefail
          umask 077

          REGION='{region}'
          REGISTRY='{registry}'
          APP_IMAGE='{image}'
          APP_VERSION='{version}'
          RDS_SECRET_ARN='{secret_arn}'
          POSTGRES_HOST='{db_host}'
          POSTGRES_PORT='{db_port}'
          POSTGRES_DB='{db_name}'

          mkdir -p /opt/gifff

          echo '{compose_base64}' | base64 -d > /opt/gifff/compose.yaml

          aws secretsmanager get-secret-value \
            --region "$REGION" \
            --secret-id "$RDS_SECRET_ARN" \
            --query SecretString \
            --output text > /opt/gifff/rds-secret.json

          aws secretsmanager get-secret-value \
            --region "$REGION" \
            --secret-id gifff/datadog/api-key \
            --query SecretString \
            --output text > /opt/gifff/datadog-key

          python3 - <<'ENV'
          import json
          import os
          import shlex

          with open("/opt/gifff/rds-secret.json") as file:
              secret = json.load(file)

          with open("/opt/gifff/datadog-key") as file:
              datadog_key = file.read().strip()

          values = {{
              "APP_IMAGE": "{image}",
              "APP_VERSION": "{version}",
              "POSTGRES_USER": secret["username"],
              "POSTGRES_PASSWORD": secret["password"],
              "POSTGRES_DB": "{db_name}",
              "POSTGRES_HOST": "{db_host}",
              "POSTGRES_PORT": "{db_port}",
              "DD_API_KEY": datadog_key,
          }}

          with open("/opt/gifff/.env", "w") as file:
              for key, value in values.items():
                  file.write(f"{{key}}={{shlex.quote(str(value))}}\\n")

          os.chmod("/opt/gifff/.env", 0o600)
          ENV

          rm -f /opt/gifff/rds-secret.json /opt/gifff/datadog-key

          aws ecr get-login-password --region "$REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$APP_IMAGE"

          # Remove the legacy standalone container, if present.
          if ! docker inspect gifff --format '{{{{ index .Config.Labels "com.docker.compose.project" }}}}' 2>/dev/null | grep -qx gifff; then
            docker rm -f gifff 2>/dev/null || true
          fi

          cd /opt/gifff

          docker compose --env-file .env -p gifff up -d --remove-orphans

          sleep 10

          docker compose --env-file .env -p gifff ps

          curl --fail --max-time 15 http://localhost:80/
          """

          commands = [
              "sudo bash -c " + json.dumps(script)
          ]

          response = json.loads(subprocess.check_output(
              [
                  "aws", "ssm", "send-command",
                  "--region", region,
                  "--instance-ids", instance_id,
                  "--document-name", "AWS-RunShellScript",
                  "--parameters", json.dumps({"commands": commands}),
                  "--output", "json",
              ],
              text=True,
          ))

          command_id = response["Command"]["CommandId"]
          print(f"Instance: {instance_id}")
          print(f"SSM Command ID: {command_id}")

          for attempt in range(90):
              time.sleep(5)

              invocation = json.loads(subprocess.check_output(
                  [
                      "aws", "ssm", "get-command-invocation",
                      "--region", region,
                      "--command-id", command_id,
                      "--instance-id", instance_id,
                      "--output", "json",
                  ],
                  text=True,
              ))

              status = invocation["Status"]

              if status in ("Success", "Failed", "Cancelled", "TimedOut"):
                  print("Status:", status)
                  print(invocation.get("StandardOutputContent", ""))
                  print(invocation.get("StandardErrorContent", ""))

                  if status != "Success":
                      raise SystemExit(1)

                  break
          else:
              raise SystemExit("Deployment timed out")
          PY
