name: Deploy

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release belongs to main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          TAG_COMMIT=$(git rev-parse "${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main || {
            echo "Release tag does not belong to main."
            exit 1
          }
          test -f deploy/compose.yaml
          test -f deploy/remote-deploy.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/gifff:${RELEASE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to EC2
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import time

          region = os.environ["AWS_REGION"]
          version = os.environ["RELEASE_TAG"]

          def aws(*args):
              return subprocess.check_output(
                  ["aws", *args, "--region", region, "--output", "text"],
                  text=True,
              ).strip()

          account_id = aws("sts", "get-caller-identity", "--query", "Account")
          registry = f"{account_id}.dkr.ecr.{region}.amazonaws.com"

          instance_ids = aws(
              "ec2", "describe-instances", "--filters",
              "Name=tag:Name,Values=gifff-app",
              "Name=instance-state-name,Values=running",
              "--query", "Reservations[].Instances[].InstanceId",
          ).split()
          if len(instance_ids) != 1:
              raise SystemExit(f"Expected one running EC2: {instance_ids}")
          instance_id = instance_ids[0]

          databases = json.loads(subprocess.check_output(
              ["aws", "rds", "describe-db-instances", "--region", region,
               "--output", "json"], text=True,
          ))["DBInstances"]
          matches = [db for db in databases
                     if db["DBInstanceIdentifier"] == "gifff-postgres"]
          if len(matches) != 1:
              raise SystemExit("Expected one gifff-postgres RDS instance")
          db = matches[0]

          payload = {
              "region": region,
              "registry": registry,
              "image": f"{registry}/gifff:{version}",
              "version": version,
              "rds_secret_arn": db["MasterUserSecret"]["SecretArn"],
              "db_host": db["Endpoint"]["Address"],
              "db_port": str(db["Endpoint"]["Port"]),
              "db_name": db["DBName"],
              "compose": open("deploy/compose.yaml", encoding="utf-8").read(),
          }
          payload_b64 = base64.b64encode(
              json.dumps(payload).encode("utf-8")
          ).decode("ascii")
          script_b64 = base64.b64encode(
              open("deploy/remote-deploy.sh", "rb").read()
          ).decode("ascii")

          # No credentials are embedded in SSM parameters.
          commands = [
              "set -eu",
              "umask 077",
              "mkdir -p /opt/gifff",
              f"printf '%s' '{script_b64}' | base64 -d > /opt/gifff/remote-deploy.sh",
              f"PAYLOAD_B64='{payload_b64}' bash /opt/gifff/remote-deploy.sh",
          ]
          response = json.loads(subprocess.check_output(
              ["aws", "ssm", "send-command", "--region", region,
               "--instance-ids", instance_id,
               "--document-name", "AWS-RunShellScript",
               "--parameters", json.dumps({
                   "commands": commands,
                   "executionTimeout": ["900"],
               }), "--output", "json"], text=True,
          ))
          command_id = response["Command"]["CommandId"]
          print(f"Instance: {instance_id}")
          print(f"SSM Command ID: {command_id}")

          for _ in range(180):
              time.sleep(5)
              try:
                  result = json.loads(subprocess.check_output(
                      ["aws", "ssm", "get-command-invocation",
                       "--region", region, "--command-id", command_id,
                       "--instance-id", instance_id, "--output", "json"],
                      text=True, stderr=subprocess.PIPE,
                  ))
              except subprocess.CalledProcessError as exc:
                  if b"InvocationDoesNotExist" in exc.stderr:
                      continue
                  raise
              status = result["Status"]
              if status in {"Success", "Failed", "Cancelled", "TimedOut"}:
                  print("Status:", status)
                  print("Response code:", result["ResponseCode"])
                  print(result.get("StandardOutputContent", ""))
                  print(result.get("StandardErrorContent", ""))
                  if status != "Success" or result["ResponseCode"] != 0:
                      raise SystemExit("Deployment failed")
                  break
          else:
              raise SystemExit("Deployment timed out")
          PY
